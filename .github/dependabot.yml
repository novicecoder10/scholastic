version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem rather than a dozen: these move together, and a
      # partial bump of a framework is more likely to break than either version.
      next:
        patterns: ["next", "react", "react-dom", "@types/react", "@types/react-dom"]
      tooling:
        patterns: ["eslint*", "prettier*", "typescript", "vitest", "@vitest/*", "@playwright/*"]
    ignore:
      # typescript-eslint refuses to load against TS >= 7.0, so a TypeScript 7
      # bump fails `pnpm lint` outright — and because TypeScript shares the
      # `tooling` group, it takes the other four bumps down with it. Pinning it
      # below 7 lets the rest of the group land on its own schedule.
      # Drop this once typescript-eslint supports TS >= 7.1:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: typescript
        versions: [">= 7"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
