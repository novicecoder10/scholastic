version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem rather than a dozen: these move together, and a
      # partial bump of a framework is more likely to break than either version.
      next:
        patterns: ["next", "react", "react-dom", "@types/react", "@types/react-dom"]
      # The linter stack moves on its own schedule: an ESLint major routinely
      # lands before the plugins that have to load into it, and while it sits
      # there waiting it should not hold up the test and formatter bumps it
      # has nothing to do with.
      eslint:
        patterns: ["eslint*", "@typescript-eslint/*", "typescript-eslint"]
      tooling:
        patterns: ["prettier*", "typescript", "vitest", "@vitest/*", "@playwright/*"]
    ignore:
      # typescript-eslint refuses to load against TS >= 7.0, so a TypeScript 7
      # bump fails `pnpm lint` outright and takes the rest of its PR down with
      # it — the linter runs over the whole repo regardless of which group the
      # compiler happens to travel in.
      # Drop this once typescript-eslint supports TS >= 7.1:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: typescript
        versions: [">= 7"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
